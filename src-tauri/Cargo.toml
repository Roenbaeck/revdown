[package]
name = "revdown"
version = "0.1.0"
description = "Review Markdown without changing the source document"
authors = ["Revdown contributors"]
license = "MIT"
repository = "https://github.com/lars/revdown"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "revdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
base64 = "0.22.1"
hex = "0.4.3"
open = "5.3.2"
rfd = "0.15.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tauri = { version = "2.8.5", features = [] }
thiserror = "2.0.16"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.0", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.21.0"
